<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Aura / Glow -->
    <radialGradient id="auraGlow" cx="50%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glassmorphic highlights -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="48" fill="url(#bgGrad)" />
  <circle cx="200" cy="160" r="150" fill="url(#auraGlow)" />

  <!-- Abstract Tech Grid Lines -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <circle cx="200" cy="200" r="160" fill="none" stroke-dasharray="4 8" />
    <circle cx="200" cy="200" r="120" fill="none" />
    <circle cx="200" cy="200" r="80" fill="none" stroke-dasharray="2 4" />
    <line x1="200" y1="20" x2="200" y2="380" />
    <line x1="20" y1="200" x2="380" y2="200" />
  </g>

  <!-- Developer Silhouette / Character Representation -->
  <g filter="url(#softShadow)">
    <!-- Shoulders / Body -->
    <path d="M 100 360 C 100 280, 140 250, 200 250 C 260 250, 300 280, 300 360 Z" fill="url(#accentGrad)" />
    <!-- Collar / Hoodie V-neck -->
    <path d="M 175 250 L 200 285 L 225 250 Z" fill="#0f172a" opacity="0.6" />

    <!-- Head / Neck -->
    <rect x="180" y="210" width="40" height="45" rx="8" fill="#fbcfe8" opacity="0.85" />
    <circle cx="200" cy="165" r="55" fill="#fed7aa" />

    <!-- Modern Haircut -->
    <path d="M 140 160 C 140 105, 170 95, 200 95 C 235 95, 260 110, 260 160 C 255 130, 235 115, 200 115 C 165 115, 145 135, 140 160 Z" fill="#1e293b" />
    <path d="M 145 155 Q 160 120 200 120 Q 240 120 255 155 Q 260 110 200 100 Q 140 110 145 155 Z" fill="#0f172a" />

    <!-- Modern Glasses -->
    <g stroke="url(#accentGrad)" stroke-width="4" fill="url(#glassGrad)">
      <rect x="156" y="150" width="36" height="26" rx="6" />
      <rect x="208" y="150" width="36" height="26" rx="6" />
      <line x1="192" y1="163" x2="208" y2="163" />
    </g>

    <!-- Eyes (behind glasses) -->
    <circle cx="174" cy="163" r="3" fill="#1e293b" />
    <circle cx="226" cy="163" r="3" fill="#1e293b" />

    <!-- Friendly Smile -->
    <path d="M 188 192 Q 200 202 212 192" stroke="#ea580c" stroke-width="3" stroke-linecap="round" fill="none" />
  </g>

  <!-- Glowing Badge on Avatar -->
  <g transform="translate(140, 310)">
    <rect width="120" height="32" rx="16" fill="#0f172a" stroke="url(#accentGrad)" stroke-width="2" />
    <text x="60" y="21" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5" text-anchor="middle">GOLU KUMAR</text>
  </g>
</svg>
